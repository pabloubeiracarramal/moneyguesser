services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moneyguesser-backend
    ports:
      - "3301:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    networks:
      - moneyguesser-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://moneyguesser-api.pabloubeiracarramal.com
    container_name: moneyguesser-frontend
    ports:
      - "3300:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - moneyguesser-network

networks:
  moneyguesser-network:
    driver: bridge
